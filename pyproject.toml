[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "guide2kulchur"
description = "Goodreads collection and research pipelines"
requires-python = ">=3.13.3"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
version = "1.0.0"
authors = [{"name" = "rhawrami", "email" = "ravanhawrami@gmail.com"}]
readme = {"file" = "README.md", content-type = "text/markdown"}
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "geopy",
    "ipysigma",
    "lxml",
    "networkx",
    "pandas",
    "plotly",
    "psycopg[binary]",
    "python-dotenv",
    "requests",
]

[project.scripts]
g2k = "guide2kulchur.pipeline.cli:main"

[tool.setuptools]
packages = { find = { include = ["guide2kulchur*"] } }
